<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Must Murder Mommy - HTML5</title>
  <style>
    html,body { height:100%; margin:0; background:#000; }
    #gameCanvas { width:100%; height:100%; display:block; margin:0 auto; }
  </style>
</head>
<body>
  <!--
    Place this file next to the compiled HTML5 output (the JS/CSS generated by Lime/OpenFL).
    Typical locations after building:
      - export/debug/html5/bin/index.html
      - export/release/html5/bin/index.html
    The compiled JS file is usually named after the project (file="mommyGF" in Project.xml),
    so the runtime JS will be loaded automatically if you open the generated index.html.
    If you prefer to use this lightweight wrapper, make sure to point the <script> src below
    to the compiled JS file (e.g. "mommyGF.js" or "bin/mommyGF.js").
  -->
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Example: if your compiled JS sits next to this file and is named mommyGF.js,
       uncomment and adjust the line below. -->
  <!-- <script src="mommyGF.js"></script> -->

  <noscript>
    This game requires JavaScript to run.
  </noscript>
</body>
</html>
